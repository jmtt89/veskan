<!doctype html>
<!--
  `lang` se queda en español y NO es una incoherencia con el SEO en inglés.
  Este atributo no es una señal de buscador: es lo que hace que un lector de
  pantalla pronuncie el texto de la interfaz con fonética española. La interfaz
  es española, así que cambiarlo a `en` rompería la accesibilidad de usuarios
  reales a cambio de una señal marginal.

  El resto de metadatos va en inglés a propósito: la mayoría de las búsquedas
  sobre aditivos y números E se hacen en inglés, y quien busque en español
  suele encontrar igualmente el resultado en inglés — no al revés.
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b7a44" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Scan a food barcode and get an open, auditable 0–100 health score: Nutri-Score 2023, NOVA processing, the PAHO nutrient profile model and additive hazard data from EFSA, IARC and the EU CLP Regulation. Runs entirely in your browser."
    />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Veskan — food health score and E number check by barcode</title>

    <!--
      La canónica es absoluta a propósito, aunque `base` sea relativa: el
      contenido es el mismo servido desde el dominio de Pages, desde una copia
      local o desde una rama de previsualización, y sin esto cada copia compite
      con el original.
    -->
    <link rel="canonical" href="https://jmtt89.github.io/veskan/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Veskan" />
    <link rel="license" href="https://www.gnu.org/licenses/agpl-3.0.html" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Veskan" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:url" content="https://jmtt89.github.io/veskan/" />
    <meta property="og:title" content="Veskan — food health score and E number check by barcode" />
    <meta
      property="og:description"
      content="Scan a food barcode and get an open, auditable 0–100 health score: Nutri-Score 2023, NOVA processing, the PAHO nutrient profile model and additive hazard data from EFSA, IARC and the EU CLP Regulation. Every calculation runs in your browser — nothing you scan is sent anywhere."
    />
    <meta property="og:image" content="https://jmtt89.github.io/veskan/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Veskan icon" />
    <meta name="twitter:card" content="summary" />
    <!--
      Datos estructurados. Tres cosas distintas y por eso tres nodos:

        SoftwareApplication  la aplicación, para quien la busque para usarla
        Dataset              la base de peligro de aditivos, que es contenido
                             propio y es lo que hace falta para que la
                             indexen buscadores de datos y no sólo de páginas
        SoftwareSourceCode   el código, que es AGPL y auditable, y es media
                             la razón de ser del proyecto

      `offers` con precio cero está porque sin él algunos validadores tratan
      una aplicación sin precio como incompleta, no porque se venda.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareApplication",
            "@id": "https://jmtt89.github.io/veskan/#app",
            "name": "Veskan",
            "url": "https://jmtt89.github.io/veskan/",
            "applicationCategory": "HealthApplication",
            "operatingSystem": "Any (navegador web)",
            "browserRequirements": "Requiere JavaScript y, para escanear, acceso a la cámara.",
            "inLanguage": "es",
            "isAccessibleForFree": true,
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
            "license": "https://www.gnu.org/licenses/agpl-3.0.html",
            "description": "Scan a food barcode and get an open, auditable health score from 0 to 100. Every calculation runs in the browser: there is no server, and nothing you scan is sent anywhere.",
            "featureList": [
              "Nutri-Score 2023",
              "NOVA food processing classification",
              "PAHO nutrient profile model",
              "Additive hazard data from EFSA, IARC and the EU CLP Regulation",
              "Works offline"
            ]
          },
          {
            "@type": "Dataset",
            "@id": "https://github.com/jmtt89/veskan-data/tree/aditivos#dataset",
            "name": "Food additive hazard database",
            "description": "671 food additives with a hazard level, the certainty behind it and where it comes from: acceptable daily intakes and critical effects from EFSA OpenFoodTox, IARC carcinogenicity classifications, CMR classifications from Annex VI of the EU CLP Regulation, status under Regulation (EC) 1333/2008, and bans and withdrawals per jurisdiction with the literal wording of each act. Prohibition and withdrawal are kept apart, and so are the study findings of an EFSA dossier and the conclusion of its Panel.",
            "url": "https://github.com/jmtt89/veskan-data/tree/aditivos",
            "inLanguage": ["en", "es"],
            "license": "https://opendatacommons.org/licenses/odbl/1-0/",
            "isAccessibleForFree": true,
            "creator": { "@type": "Organization", "name": "Veskan" },
            "keywords": [
              "food additives",
              "E numbers",
              "EFSA",
              "IARC",
              "food safety",
              "OpenFoodTox",
              "acceptable daily intake",
              "food additive bans"
            ],
            "distribution": [
              {
                "@type": "DataDownload",
                "encodingFormat": "application/vnd.apache.parquet",
                "contentUrl": "https://raw.githubusercontent.com/jmtt89/veskan-data/aditivos/index.json",
                "description": "17 Parquet tables, queryable without a server over HTTP range requests. index.json lists every table with its size and row count."
              },
              {
                "@type": "DataDownload",
                "encodingFormat": "application/vnd.sqlite3",
                "contentUrl": "https://raw.githubusercontent.com/jmtt89/veskan-data/aditivos/aditivos.sqlite3",
                "description": "The slice resolved by E number that the application consumes."
              }
            ]
          },
          {
            "@type": "SoftwareSourceCode",
            "name": "Veskan",
            "codeRepository": "https://github.com/jmtt89/veskan",
            "programmingLanguage": "TypeScript",
            "license": "https://www.gnu.org/licenses/agpl-3.0.html",
            "about": { "@id": "https://jmtt89.github.io/veskan/#app" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="app">
      <noscript>
        <!--
          Lo único que ve un rastreador que no ejecuta JavaScript. Va en los
          dos idiomas: en inglés porque es el idioma del SEO, y en español
          porque es el de la interfaz y el de quien acabe leyéndolo de verdad.
        -->
        <p style="padding: 2rem; text-align: center" lang="en">
          Veskan needs JavaScript: the whole analysis runs in your browser, with no server.
        </p>
        <p style="padding: 0 2rem 2rem; text-align: center">
          Veskan necesita JavaScript: todo el análisis se ejecuta en tu navegador, sin servidor.
        </p>
      </noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
